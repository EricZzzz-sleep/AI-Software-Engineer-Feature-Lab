<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign editing space</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/editor.js" defer></script>
</head>
<body>
  <main>
    <div class="session-bar" id="session-bar" hidden>
      <div><label for="actor">Test session</label><select id="actor"><option value="">Choose an actor</option></select></div>
      <button id="signin" type="button">Sign in</button>
      <span id="identity"></span>
    </div>
    <!-- mentor-start -->
    <section id="mentor-drills" hidden aria-labelledby="mentor-heading">
      <h2 id="mentor-heading">Mentor drills</h2>
      <div class="actions">
        <button id="fail-save" type="button" disabled>Fail my next save before commit</button>
        <button id="reset-v7" type="button">Reset fixtures to v7</button>
      </div>
      <p id="mentor-status" role="status" aria-live="polite">Local exercise controls. Reset replaces demo data and revokes all sessions.</p>
    </section>
    <!-- mentor-end -->
    <p id="notice" role="status" aria-live="polite">Loading editing space…</p>
    <div class="campaign-picker" id="picker" hidden><label for="campaign">Campaign</label><select id="campaign"></select></div>
    <article id="editor" hidden aria-labelledby="title">
      <header><h1 id="title">Campaign</h1><span id="saved">Saved</span></header>
      <section id="generation-panel" aria-labelledby="generation-heading">
        <h2 id="generation-heading">Generation status</h2>
        <p id="generation-status" role="status" aria-live="polite">Loading generation status…</p>
        <p id="job-id" class="hint"></p>
        <div id="fake-generation" hidden>
          <label for="scenario">Test generation scenario</label>
          <select id="scenario">
            <option value="success">success</option><option value="delayed_success">delayed_success</option>
            <option value="timeout">timeout</option><option value="malformed">malformed</option>
            <option value="transient_then_ok">transient_then_ok</option>
          </select>
          <button id="release-job" type="button" disabled>Release delayed job</button>
          <p id="fake-status" role="status"></p>
        </div>
      </section>
      <div id="editor-tabs" role="tablist" aria-label="Campaign views" hidden>
        <button id="edit-tab" type="button" role="tab" aria-selected="true" aria-controls="edit-panel">Edit campaign</button>
        <button id="versions-tab" type="button" role="tab" aria-selected="false" aria-controls="versions-panel" tabindex="-1">Review versions</button>
      </div>
      <div id="edit-panel" role="tabpanel" aria-labelledby="edit-tab">
      <div class="panes">
        <section aria-labelledby="brief-heading">
          <h2 id="brief-heading">Brief</h2>
          <div class="field-panel">
            <label for="goal">Goal + audience</label><textarea id="goal" rows="3" maxlength="20000"></textarea>
            <label for="facts">Source facts</label><textarea id="facts" rows="3" maxlength="20000"></textarea>
            <label for="tone">Tone</label><input id="tone" maxlength="20000">
          </div>
          <div class="actions"><button id="save" type="button">Save</button><button id="generate" type="button" disabled aria-describedby="generate-reason">Generate</button></div>
          <p class="hint" id="generate-reason">Generation is not configured</p>
        </section>
        <section aria-labelledby="draft-heading">
          <h2 id="draft-heading">Draft</h2>
          <div class="field-panel draft-panel"><label for="draft">Draft text</label><textarea id="draft" maxlength="20000"></textarea><p class="hint" id="draft-status">Editable text</p></div>
          <div class="actions"><button id="review" type="button" aria-describedby="workflow-reason">Review</button><button id="publish" type="button" class="primary" aria-describedby="workflow-reason">Publish</button></div>
          <p class="hint" id="workflow-reason"></p>
        </section>
      </div>
      <div class="recovery"><p id="status" role="status" aria-live="polite"></p><button id="reload" type="button">Reload saved content</button></div>
      <section id="publications" aria-labelledby="publications-heading" hidden><h2 id="publications-heading">Published versions</h2><div id="publication-list"></div></section>
      </div>
      <section id="versions-panel" role="tabpanel" aria-labelledby="versions-tab" hidden>
        <h2>Saved versions</h2>
        <label for="version-select">Version to review</label>
        <select id="version-select"></select>
        <p id="version-meta"></p>
        <div id="version-preview" tabindex="0" aria-label="Saved version content"></div>
        <button id="review-version" type="button" disabled>Review selected version</button>
        <p id="versions-status" role="status" aria-live="polite"></p>
      </section>
    </article>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="dialog-content"></div>
    <div class="actions"><button id="dialog-cancel" type="button">Cancel</button><button id="dialog-confirm" type="button" class="primary">Confirm</button></div>
  </dialog>
</body>
</html>
